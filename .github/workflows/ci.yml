name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node.js version: engines.node in apps/expo/package.json (Vercel reads it too).
  # The desktop wrapper is not built in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  app:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        id: setup-node
        with:
          node-version-file: app/apps/expo/package.json
          package-manager-cache: false
      - run: python3 -m unittest scripts/test_assert_no_premium_side_effects.py -v
        working-directory: app
      - run: bash scripts/pnpm-install-filtered.sh --frozen-lockfile
        working-directory: app
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - run: python3 scripts/assert-no-premium-side-effects.py
        working-directory: app
        env:
          SETUP_NODE_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
      - run: pnpm typecheck
        working-directory: app
      - run: pnpm test
        working-directory: app

  e2e:
    name: End-to-end (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        id: setup-node
        with:
          node-version-file: app/apps/expo/package.json
          package-manager-cache: false
      - run: bash scripts/pnpm-install-filtered.sh --frozen-lockfile
        working-directory: app
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - run: python3 scripts/assert-no-premium-side-effects.py
        working-directory: app
        env:
          SETUP_NODE_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
      - run: npm ci
        working-directory: app/packages/medusa-plugin
      - run: npm ci
        working-directory: app/dev/medusa-store
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      - run: pnpm e2e
        working-directory: app
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            app/test-results
            app/playwright-report

  web-export:
    name: Web export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        id: setup-node
        with:
          node-version-file: app/apps/expo/package.json
          package-manager-cache: false
      - run: bash scripts/pnpm-install-filtered.sh --frozen-lockfile
        working-directory: app
        env:
          RXDB_PREMIUM: ${{ secrets.RXDB_PREMIUM }}
      - run: python3 scripts/assert-no-premium-side-effects.py
        working-directory: app
        env:
          SETUP_NODE_CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
      - run: pnpm --filter @medusapos/expo build:web
        env:
          CI: '1'
        working-directory: app
      - run: bash scripts/check-web-bundle.sh apps/expo/dist
        working-directory: app

  dev-store:
    name: Dev store unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: apps/expo/package.json
          cache: npm
          cache-dependency-path: dev/medusa-store/package-lock.json
      - run: npm ci
        working-directory: dev/medusa-store
      - run: npm run test:unit
        working-directory: dev/medusa-store/apps/backend

  medusa-plugin:
    name: Medusa plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MEDUSA_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/setup-node@v5
        with:
          node-version-file: app/apps/expo/package.json
          cache: npm
          cache-dependency-path: app/packages/medusa-plugin/package-lock.json
      - run: npm ci
        working-directory: app/packages/medusa-plugin
      - run: npm run typecheck
        working-directory: app/packages/medusa-plugin
      - run: npm run test:unit -- --maxWorkers=2
        working-directory: app/packages/medusa-plugin
      - run: npm run test:integration:modules -- --maxWorkers=1
        working-directory: app/packages/medusa-plugin
      - run: npm run test:integration:http -- --maxWorkers=1
        working-directory: app/packages/medusa-plugin
      # The rejected-order backfill as an operator runs it, through npx medusa exec (see its README).
      - run: bash integration-tests/backfill-seed/run.sh
        working-directory: app/packages/medusa-plugin
      - run: npm run build
        working-directory: app/packages/medusa-plugin
      # The tarball must ship no compiled tests or fixtures, and every runtime file.
      - run: node scripts/check-pack.mjs
        working-directory: app/packages/medusa-plugin

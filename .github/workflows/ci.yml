name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # TallyUI commit the app builds against (root pnpm.overrides use file:../tallyui); bump deliberately.
  TALLYUI_REF: 3996453ef752f246167075d06ca3dcda0b3098fd
  # The desktop wrapper is not built in CI.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  app:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/checkout@v5
        with:
          repository: TallyUI/tallyui
          ref: ${{ env.TALLYUI_REF }}
          path: tallyui
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm typecheck
        working-directory: app
      - run: pnpm test
        working-directory: app

  e2e:
    name: End-to-end (web)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/checkout@v5
        with:
          repository: TallyUI/tallyui
          ref: ${{ env.TALLYUI_REF }}
          path: tallyui
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: npm ci
        working-directory: app/packages/medusa-plugin
      - run: npm ci
        working-directory: app/dev/medusa-store
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: app
      - run: pnpm e2e
        working-directory: app
        env:
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failure
          path: |
            app/test-results
            app/playwright-report

  web-export:
    name: Web export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/checkout@v5
        with:
          repository: TallyUI/tallyui
          ref: ${{ env.TALLYUI_REF }}
          path: tallyui
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm --filter @medusapos/expo build:web
        env:
          CI: '1'
        working-directory: app
      - run: bash scripts/check-web-bundle.sh apps/expo/dist
        working-directory: app

  dev-store:
    name: Dev store unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/medusa-store/package-lock.json
      - run: npm ci
        working-directory: dev/medusa-store
      - run: npm run test:unit
        working-directory: dev/medusa-store/apps/backend

  medusa-plugin:
    name: Medusa plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      MEDUSA_DISABLE_TELEMETRY: 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          path: app
      - uses: actions/checkout@v5
        with:
          repository: TallyUI/tallyui
          ref: ${{ env.TALLYUI_REF }}
          path: tallyui
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/packages/medusa-plugin/package-lock.json
      - run: npm ci
        working-directory: app/packages/medusa-plugin
      - run: npm run typecheck
        working-directory: app/packages/medusa-plugin
      - run: npm run test:unit -- --maxWorkers=2
        working-directory: app/packages/medusa-plugin
      - run: npm run test:integration:modules -- --maxWorkers=1
        working-directory: app/packages/medusa-plugin
      - run: npm run test:integration:http -- --maxWorkers=1
        working-directory: app/packages/medusa-plugin
      - run: npm run build
        working-directory: app/packages/medusa-plugin
